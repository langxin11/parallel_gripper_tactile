default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: pytest
        name: Full test suite
        entry: uv run pytest -n auto
        language: system
        pass_filenames: false
