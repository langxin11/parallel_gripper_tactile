[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "parallel-gripper-tactile"
version = "0.2.0"
description = "MuJoCo 平行夹爪指尖触觉仿真、资产与实验工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "mujoco>=3.1",
    "numpy>=2.0",
    "rerun-sdk>=0.34,<0.35",
    "SciencePlots>=2.0",
]

[project.scripts]
pgt-check = "parallel_gripper_tactile.cli:check"

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
