[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "parallel-gripper-tactile"
version = "0.3.0"
description = "MuJoCo 平行夹爪指尖触觉仿真、资产与实验工具"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "dm-grasp-core==0.1.0",
    "robotiq-grasp-core==0.1.0",
    "imageio>=2.37.4",
    "matplotlib>=3.8",
    "mujoco>=3.1",
    "numpy>=2.0",
    "pyarrow>=18.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "rerun-sdk>=0.34,<0.35",
    "rich>=13.0",
    "SciencePlots>=2.0",
    "simple-pid>=2.0",
    "typer>=0.12",
    "polars>=1.44.2",
    "scipy>=1.18.1",
]

[project.scripts]
pgt = "parallel_gripper_tactile.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.6.2",
    "pytest>=7.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15",
    "zensical>=0.0.56",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/dm_grasp_core/tests",
    "packages/robotiq_grasp_core/tests",
    "packages/dmgripper_hardware/tests",
    "packages/dmgripper_experiments/tests",
    "packages/robotiq_hardware/tests",
    "packages/papillarray_hardware/tests",
]
addopts = "-q --import-mode=importlib"

# 依赖规则契约：对应 docs/architecture.md 的分层与边界约定，
# 由 tests/test_architecture_contracts.py 并入 pytest 门禁。
[tool.importlinter]
root_packages = [
    "parallel_gripper_tactile",
    "dm_grasp_core",
    "robotiq_grasp_core",
    "dmgripper_hardware",
    "robotiq_hardware",
    "papillarray_hardware",
]

[[tool.importlinter.contracts]]
name = "主包分层：入口 → study → runner → 实验 → 领域 → 共享"
type = "layers"
layers = [
    "parallel_gripper_tactile.cli",
    "parallel_gripper_tactile.studies",
    "parallel_gripper_tactile.runners",
    "parallel_gripper_tactile.experiments",
    "parallel_gripper_tactile.control : parallel_gripper_tactile.perception : parallel_gripper_tactile.scenes : parallel_gripper_tactile.tactile : parallel_gripper_tactile.contact_taxels : parallel_gripper_tactile.force_scheduling : parallel_gripper_tactile.dm_admittance : parallel_gripper_tactile.asset_tools : parallel_gripper_tactile.profiles : parallel_gripper_tactile.run_artifacts : parallel_gripper_tactile.plotstyle : parallel_gripper_tactile.friction_plots : parallel_gripper_tactile.taxel_friction : parallel_gripper_tactile.tactile_slip : parallel_gripper_tactile.friction_estimation : parallel_gripper_tactile.discrete_force_control",
    "parallel_gripper_tactile.config : parallel_gripper_tactile.simulation : parallel_gripper_tactile.timing : parallel_gripper_tactile.analysis : parallel_gripper_tactile.visualization : parallel_gripper_tactile.artifacts : parallel_gripper_tactile.validation : parallel_gripper_tactile.protocols : parallel_gripper_tactile.recording : parallel_gripper_tactile.video",
]

[[tool.importlinter.contracts]]
name = "场景装配不读取控制目标"
type = "forbidden"
source_modules = ["parallel_gripper_tactile.scenes"]
forbidden_modules = [
    "parallel_gripper_tactile.control",
    "parallel_gripper_tactile.force_scheduling",
    "parallel_gripper_tactile.dm_admittance",
]

[[tool.importlinter.contracts]]
name = "控制器不装配场景"
type = "forbidden"
source_modules = [
    "parallel_gripper_tactile.control",
    "parallel_gripper_tactile.dm_admittance",
    "parallel_gripper_tactile.force_scheduling",
]
forbidden_modules = ["parallel_gripper_tactile.scenes"]

[[tool.importlinter.contracts]]
name = "触觉读取不决定控制状态"
type = "forbidden"
source_modules = [
    "parallel_gripper_tactile.tactile",
    "parallel_gripper_tactile.contact_taxels",
]
forbidden_modules = [
    "parallel_gripper_tactile.control",
    "parallel_gripper_tactile.force_scheduling",
    "parallel_gripper_tactile.dm_admittance",
]

[[tool.importlinter.contracts]]
name = "主包内部不回引兼容层"
type = "forbidden"
source_modules = ["parallel_gripper_tactile"]
forbidden_modules = [
    "parallel_gripper_tactile.profiles",
    "parallel_gripper_tactile.run_artifacts",
    "parallel_gripper_tactile.plotstyle",
    "parallel_gripper_tactile.friction_plots",
    "parallel_gripper_tactile.taxel_friction",
    "parallel_gripper_tactile.tactile_slip",
    "parallel_gripper_tactile.friction_estimation",
    "parallel_gripper_tactile.discrete_force_control",
]

[[tool.importlinter.contracts]]
name = "Robotiq 共享核不依赖仿真主包与 DM 核"
type = "forbidden"
source_modules = ["robotiq_grasp_core"]
forbidden_modules = ["parallel_gripper_tactile", "dm_grasp_core"]

[[tool.importlinter.contracts]]
name = "DM 共享核不依赖仿真主包与 Robotiq 核"
type = "forbidden"
source_modules = ["dm_grasp_core"]
forbidden_modules = ["parallel_gripper_tactile", "robotiq_grasp_core"]

[[tool.importlinter.contracts]]
name = "DM 硬件包不依赖仿真主包与其他设备包"
type = "forbidden"
source_modules = ["dmgripper_hardware"]
forbidden_modules = [
    "parallel_gripper_tactile",
    "robotiq_grasp_core",
    "robotiq_hardware",
    "papillarray_hardware",
]

[[tool.importlinter.contracts]]
name = "Robotiq 硬件包不依赖仿真主包与其他设备包"
type = "forbidden"
source_modules = ["robotiq_hardware"]
forbidden_modules = [
    "parallel_gripper_tactile",
    "dmgripper_hardware",
    "papillarray_hardware",
]

[[tool.importlinter.contracts]]
name = "PapillArray 设备包不依赖仿真主包与其他设备包"
type = "forbidden"
source_modules = ["papillarray_hardware"]
forbidden_modules = [
    "parallel_gripper_tactile",
    "dmgripper_hardware",
    "robotiq_hardware",
]

[tool.uv.workspace]
members = [
    "packages/dm_grasp_core",
    "packages/robotiq_grasp_core",
    "packages/dmgripper_hardware",
    "packages/dmgripper_experiments",
    "packages/robotiq_hardware",
    "packages/papillarray_hardware",
]

[tool.uv.sources]
dm-grasp-core = { workspace = true }
dmgripper-hardware = { workspace = true }
papillarray-hardware = { workspace = true }
robotiq-grasp-core = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 仅豁免与英文语法/ASCII 标点绑定的规则：中文 docstring 的祈使语气、首词大写
# 与全角句号会触发 D401/D403/D404/D400/D415 误报；其余格式类 D 规则仍生效。
"conftest.py" = ["D400", "D401", "D403", "D404", "D415"]
"tests/**" = ["D400", "D401", "D403", "D404", "D415"]
# 研究脚本同样使用中文 docstring，并遵循与包代码一致的语言规则。
"scripts/**" = ["D400", "D401", "D403", "D404", "D415"]
# The public library keeps domain documentation in Chinese. These English- and
# ASCII-punctuation-specific pydocstyle checks do not apply to that prose.
"src/**" = ["D400", "D401", "D403", "D404", "D415"]
