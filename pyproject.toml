[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "parallel-gripper-tactile"
version = "0.2.0"
description = "MuJoCo 平行夹爪指尖触觉仿真、资产与实验工具"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "mujoco>=3.1",
    "numpy>=2.0",
    "rerun-sdk>=0.34,<0.35",
    "SciencePlots>=2.0",
]

[project.scripts]
pgt-check = "parallel_gripper_tactile.cli:check"

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 仅豁免与英文语法/ASCII 标点绑定的规则：中文 docstring 的祈使语气、首词大写
# 与全角句号会触发 D401/D403/D404/D400/D415 误报；其余格式类 D 规则仍生效。
"tests/**" = ["D400", "D401", "D403", "D404", "D415"]
"scripts/**" = ["D400", "D401", "D403", "D404", "D415"]
