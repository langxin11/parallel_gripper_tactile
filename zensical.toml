[project]
site_name = "平行夹爪指尖触觉仿真"
docs_dir = "docs"
nav = [
  { "首页" = "index.md" },
  { "项目架构" = "architecture.md" },
  { "代码与注释规范" = "coding-conventions.md" },
  { "触觉读数约定" = "tactile-conventions.md" },
  { "曲柄滑块力控模型" = "crank-slider-force-control.md" },
  { "常用工作流" = "workflows.md" },
  { "Onshape 导出与升级" = "onshape-export-upgrade.md" },
  { "自研夹爪状态与后续工作" = "custom-gripper-next-phase.md" },
]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.markdown_extensions]
pymdownx.arithmatex.generic = true

[project.theme]
language = "zh"
features = [
  "navigation.expand",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
]
