[project]
site_name = "平行夹爪指尖触觉仿真"
docs_dir = "docs"
nav = [
  { "快速开始" = "index.md" },
  { "常用工作流" = "workflows.md" },
  { "推荐路线" = [
    { "1. 触觉读数约定" = "tactile-conventions.md" },
    { "2. Onshape 导出" = "onshape-export-upgrade.md" },
    { "3. 曲柄滑块力控模型" = "crank-slider-force-control.md" },
    { "4. 动态目标力跟踪" = "force-tracking.md" },
    { "5. Oracle 目标力调度" = "force-scheduling.md" },
    { "6. 切向扰动与 MIT 触觉增力" = "tangential-disturbance.md" },
    { "7. 微滑移探测与摩擦估计" = "friction-estimation.md" },
    { "8. Robotiq 离散力控制" = "discrete-force-control.md" },
    { "9. 控制算法对比与消融" = "control-comparison-ablation.md" },
  ] },
  { "工程基线" = [
    { "DMgripper 配置与执行器基线" = "dmgripper-configuration.md" },
    { "项目架构" = "architecture.md" },
    { "DMgripper 通用抓取实验" = "dmgripper-experiments.md" },
    { "DMgripper 共享控制核" = "dm-shared-control.md" },
    { "科研配置" = "research-configuration.md" },
    { "测试规范" = "testing.md" },
    { "科研报告" = "reports.md" },
    { "代码与注释规范" = "coding-conventions.md" },
  ] },
  { "归档" = [
    { "配置重构 Goal" = "archive/configuration-refactor-goal.md" },
    { "配置重构历史基线" = "archive/configuration-migration-baseline.md" },
    { "DMgripper 真机倒水历史数据" = "archive/dmgripper-cup.md" },
  ] },
]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.markdown_extensions]
attr_list = {}
pymdownx.arithmatex.generic = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.theme]
language = "zh"
features = [
  "navigation.expand",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
]
