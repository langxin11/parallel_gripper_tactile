[project]
site_name = "平行夹爪指尖触觉仿真"
docs_dir = "docs"
nav = [
  { "快速开始" = "index.md" },
  { "夹爪与模型" = [
    { "Robotiq 2F-85" = "grippers/robotiq-2f85/index.md" },
    { "DMgripper" = "grippers/dmgripper/index.md" },
    { "DM 电机建模依据" = "grippers/dmgripper/motor-model.md" },
  ] },
  { "使用指南" = [
    { "常用工作流" = "workflows.md" },
    { "DM 真机抓取实验" = "dmgripper-experiments.md" },
  ] },
  { "接口与控制原理" = [
    { "触觉接口与读取" = "tactile-conventions.md" },
    { "DM 控制基础与共享核" = "dm-shared-control.md" },
    { "DM 动态目标力跟踪" = "force-tracking.md" },
    { "Robotiq 离散力控制" = "discrete-force-control.md" },
    { "自适应抓取" = [
      { "路线总览" = "adaptive-grasping.md" },
      { "Oracle 目标力调度" = "force-scheduling.md" },
      { "切向扰动下的触觉增力" = "tangential-disturbance.md" },
      { "接触变化检测与摩擦估计" = "friction-estimation.md" },
    ] },
  ] },
  { "实验与复现" = [
    { "科研配置与编排" = "research-configuration.md" },
    { "模型验证与控制对比" = "control-comparison-ablation.md" },
    { "科研报告" = "reports.md" },
  ] },
  { "开发与贡献" = [
    { "项目架构" = "architecture.md" },
    { "代码与文档规范" = "coding-conventions.md" },
    { "测试策略" = "testing.md" },
  ] },
]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.markdown_extensions]
attr_list = {}
admonition = {}
tables = {}
pymdownx.snippets = { base_path = ["."], check_paths = true }
pymdownx.arithmatex.generic = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.theme]
language = "zh"
features = [
  "navigation.top",
  "toc.follow",
  "content.code.copy",
]
