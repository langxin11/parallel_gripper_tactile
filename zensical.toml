[project]
site_name = "平行夹爪指尖触觉仿真"
docs_dir = "docs"
nav = [
  { "开始阅读" = "index.md" },
  { "推荐路线" = [
    { "1. 触觉读数约定" = "tactile-conventions.md" },
    { "2. Onshape 导出" = "onshape-export-upgrade.md" },
    { "3. 曲柄滑块力控模型" = "crank-slider-force-control.md" },
    { "4. 动态目标力跟踪" = "force-tracking.md" },
    { "5. Oracle 目标力调度" = "force-scheduling.md" },
    { "6. 微滑移探测与摩擦估计" = "friction-estimation.md" },
    { "7. Robotiq 离散力控制" = "discrete-force-control.md" },
    { "8. 控制算法对比与消融" = "control-comparison-ablation.md" },
  ] },
  { "工程基线" = [
    { "自研夹爪配置基线与状态" = "custom-gripper-next-phase.md" },
    { "项目架构" = "architecture.md" },
    { "纯 Python 真机联调计划" = "python-hardware-roadmap.md" },
    { "常用工作流" = "workflows.md" },
    { "代码与注释规范" = "coding-conventions.md" },
  ] },
]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.markdown_extensions]
attr_list = {}
pymdownx.arithmatex.generic = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.theme]
language = "zh"
features = [
  "navigation.expand",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
]
