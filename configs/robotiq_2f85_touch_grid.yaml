schema_version: 1
name: robotiq_2f85_touch_grid_3x3

model:
  # Robotiq 2F-85 的 touch_grid 插件版本；网格尺寸由 MJCF 插件配置推导。
  path: ../assets/grippers/robotiq_2f85/2f85_touch_grid_3x3.xml

control:
  # Robotiq 示例模型使用位置执行器；控制量为模型内定义的 actuator 命令。
  mode: position
  actuator: fingers_actuator
  # 张开/闭合命令范围，对应 MJCF 中 position actuator 的控制输入。
  open: 0.0
  closed: 220.0

mount:
  # 抓取场景中夹爪基座的安装位姿。
  pos: [0.0, 0.0, 0.08]
  quat: [0.70710678, 0.70710678, 0.0, 0.0]

tactile:
  # 使用左右各一个 touch_grid 传感器；rows/cols 不写在 YAML 中，由加载器从 MJCF 读取。
  mode: touch_grid
  left_sensor: touch_left
  right_sensor: touch_right
