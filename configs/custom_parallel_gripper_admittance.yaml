# DM 导纳迁移验证配置；显式使用 --controller-variant admittance。
schema_version: 1
name: custom_parallel_gripper_admittance
model:
  path: ../assets/grippers/custom_parallel_gripper/parallel_gripper_height_sphere_collision.xml
control:
  mode: mit_torque
  actuator: gripper_drive
  open: 0.05
  closed: 1.3
  mit:
    p_min: 0.0
    p_max: 1.7
    v_max: 8.0
    t_max: 4.0
    kp: 10.0
    kd: 5.0
    t_ff: 0.0
  force:
    target_n: 1.0
    contact_threshold_n: 1.0
    contact_confirm_steps: 5
    release_threshold_n: 0.05
    release_confirm_steps: 25
    kp: 0.0
    ki: 0.0
    kd: 0.0
    max_position_adjustment: 0.15
    filter_cutoff_hz: 2.0
    sensor_taxel_normal_noise_std_n:
    - 0.0066666667
    - 0.0133333333
    sensor_taxel_shear_noise_std_n:
    - 0.0033333333
    - 0.01
    sensor_noise_seed: 20260814
    geometry:
      theta0_rad: 0.7853981633974483
      crank_radius_m: 0.03
      link_length_m: 0.04
      offset_m: 0.021213203435596423
    stiffness:
      enabled: false
      method: window_linear
      initial_n_per_m: 3000
      min_n_per_m: 250
      max_n_per_m: 25000
      filter_alpha: 0.15
      min_delta_closure_m: 5.0e-05
      min_delta_force_n: 0.025
      window_size: 25
      min_samples: 8
      position_feedforward_gain: 0.25
      torque_feedforward_gain: 1.0
    admittance:
      mass_kg: 0.2
      damping_ns_m: 15.0
      stiffness_n_m: 1.0
      feedforward_ratio: 0.2
      contact_stable_time_s: 0.0
      contact_transition_time_s: 0.05
      approach_velocity_rad_s: 0.05
      approach_acceleration_rad_s2: 0.5
      approach_jerk_rad_s3: 2.0
      approach_feedforward_force_n: 0.5
      approach_feedforward_ratio: 1.0
      position_min_rad: 0.0
      position_max_rad: 1.5707963267948966
      velocity_limit_rad_s: 0.05
      closing_direction: 1
      feedforward_torque_limit_nm: 4.0
      mit_torque_limit_nm: 4.0
mount:
  pos:
  - 0.0
  - 0.0
  - 0.18
  quat:
  - 0.7071067811865476
  - 0.7071067811865476
  - 0.0
  - 0.0
tactile:
  mode: contact_geom
  rows: 3
  cols: 3
  left_prefix: left_taxel_geom_
  right_prefix: right_taxel_geom_
