schema_version: 1
name: mixed_waypoint_force_tracking

approach:
  # 先以保守的平均单侧力建立稳定接触，再开始目标力跟踪。
  duration_s: 1.0
  timeout_s: 3.0
  settle_after_contact_s: 0.2
  feedforward_force_n: 1.0

reference:
  # 平滑曲线综合覆盖平台、加载斜坡和卸载段。
  interpolation: smoothstep
  # force_n 始终表示平均单侧法向力；峰值 6 N/侧。
  waypoints:
    - {t_s: 0.0, force_n: 1.0}
    - {t_s: 1.5, force_n: 1.0} # 初始平台
    - {t_s: 3.0, force_n: 6.0} # 平滑加载斜坡
    - {t_s: 4.5, force_n: 6.0} # 峰值平台
    - {t_s: 6.0, force_n: 1.0} # 平滑卸载斜坡
    - {t_s: 7.5, force_n: 1.0} # 结束平台

metrics:
  ignore_initial_s: 0.2

control_period_s: 0.002
release_support_on_tracking: false
