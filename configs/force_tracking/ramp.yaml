schema_version: 1
name: ramp_force_tracking

approach:
  # 先以保守的平均单侧力建立稳定接触，再开始目标力跟踪。
  duration_s: 1.0
  timeout_s: 3.0
  settle_after_contact_s: 0.2
  feedforward_force_n: 1.0

reference:
  # 线性曲线用于比较匀速加载、卸载和迟滞。
  interpolation: linear
  # force_n 始终表示平均单侧法向力；峰值 6 N/侧。
  waypoints:
    - {t_s: 0.0, force_n: 1.0}
    - {t_s: 2.0, force_n: 3.0} # 缓慢加载
    - {t_s: 4.0, force_n: 6.0} # 峰值
    - {t_s: 6.0, force_n: 1.0} # 匀速卸载
    - {t_s: 8.0, force_n: 1.0} # 终端保持段，用于终端稳态误差统计

metrics:
  ignore_initial_s: 0.2

control_period_s: 0.002
release_support_on_tracking: false
