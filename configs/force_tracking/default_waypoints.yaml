schema_version: 1
name: default_waypoint_force_tracking

approach:
  # 第一阶段：低速闭合直到双侧接触确认；目标力时间轴在接触稳定后才开始。
  duration_s: 1.0
  # 若超过该时间仍未进入可跟踪状态，任务会判定失败。
  timeout_s: 3.0
  # 接触确认后继续等待一小段时间，让接触和滤波状态稳定。
  settle_after_contact_s: 0.2
  # 接近阶段也使用开度雅可比计算 MIT 力矩前馈，避免纯位置闭合过软。
  feedforward_force_n: 2.0

reference:
  # 第二阶段：按 waypoint 生成时变目标法向力；支持 hold、linear、smoothstep。
  interpolation: smoothstep
  # 每个点为“跟踪阶段时间 t_s”和“目标总法向力 force_n”。时间必须严格递增。
  waypoints:
    - {t_s: 0.0, force_n: 2.0}
    - {t_s: 0.5, force_n: 2.0}
    - {t_s: 1.5, force_n: 8.0}
    - {t_s: 2.5, force_n: 5.0}
    - {t_s: 3.5, force_n: 10.0}
    - {t_s: 4.5, force_n: 8.0}

metrics:
  # 进入 track_reference 后，忽略初始瞬态再计算 RMSE/MAE/峰值误差。
  ignore_initial_s: 0.2

# 力控更新周期，不能小于 MuJoCo 物理步长。
control_period_s: 0.002
# 默认保留支撑物，只评估法向力跟踪；改为 true 可在跟踪阶段开始时释放支撑并同时考察保持能力。
release_support_on_tracking: false
