# @package controller
# 统一力跟踪状态机的导纳组合：与 unified 系列实验共享 MIT 内环、目标力、
# 滤波与接触阶段语义；位置修正 PID 关闭，需搭配 estimator=none。
defaults:
  - /controller/dm_gripper/_base
  - _self_

name: admittance
force:
  kp: 0.0
  ki: 0.0
  kd: 0.0
admittance:
  mass_kg: 0.2
  damping_ns_m: 15.0
  stiffness_n_m: 1.0
  feedforward_ratio: 0.2
  contact_stable_time_s: 0.0
  contact_transition_time_s: 0.05
  approach_velocity_rad_s: 0.05
  approach_acceleration_rad_s2: 0.5
  approach_jerk_rad_s3: 2.0
  approach_feedforward_force_n: 0.5
  approach_feedforward_ratio: 1.0
  velocity_limit_rad_s: 0.05
