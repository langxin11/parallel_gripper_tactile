# @package controller
# 二阶直接力矩 MB-ADRC：跟踪阶段旁路 MIT，由 current LESO 估计并补偿残差扰动；
# torque_adrc 参数经组合层作为覆盖传入控制器构造。
defaults:
  - /controller/dm_gripper/_base
  - _self_

name: adrc-torque
torque_adrc:
  equivalent_inertia_kg_m2: 0.0021617741125
  input_gain_scale: 2.0
  controller_bandwidth_rad_s: 60.0
  observer_bandwidth_rad_s: 240.0
  measurement_filter_cutoff_hz: 40.0
  tracking_differentiator_bandwidth_rad_s: null
  min_input_gain_n_per_n_m_s2: 5000.0
  max_input_gain_n_per_n_m_s2: 200000.0
  max_torque_rate_n_m_s: 50.0
