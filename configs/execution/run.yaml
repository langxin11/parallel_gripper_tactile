# @package execution
# 执行一次已解析的实验，并写入 trace、指标、配置快照和图表产物。
mode: run
# 相对路径锚定仓库根目录；runner 会为每次执行创建独立子目录。
output_root: ${pgt_repo:}/outputs/research
# 是否打开 MuJoCo viewer；启用时将按 realtime_factor 进行墙钟节流。
viewer: false
# viewer 或帧回调的刷新频率，单位 Hz；不改变物理步长或控制周期。
render_fps: 30.0
# viewer 的目标仿真速度与墙钟速度之比；1.0 为实时播放。
realtime_factor: 1.0
# 是否启用 MuJoCo multi-contact CCD，减少高速或薄接触的穿透风险。
multiccd_enabled: true
# trace 常规采样周期，单位 s；null 交由任务 runner 选择默认记录频率。
trace_sample_period_s: null
# 下采样时在接触、状态切换等事件前后额外保留的时间窗口，单位 s。
trace_event_window_s: 0.2
# summary 仅输出核心结果图；diagnostic 输出完整诊断图组。
plot_mode: summary
