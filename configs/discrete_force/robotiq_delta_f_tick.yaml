schema_version: 1
name: robotiq_delta_f_tick

# 单次运行的默认条件；study 会按矩阵逐条件覆盖材料、噪声与控制器变体。
# 仿真总时长需覆盖整条目标曲线并留出收尾余量。
duration_s: 24.0
# 控制周期，对应 30 Hz 决策频率。
control_period_s: 0.03333333333333333
# 动作从决策到写入 actuator 的延迟；控制器在延迟过后才开始计时。
control_delay_s: 0.0
# 力测量高斯噪声标准差与随机种子。
force_noise_std_n: 0.01
noise_seed: 0
# 默认接触材料与控制器变体。
object_material: medium
controller_variant: dynamic-step
# 平台稳态统计窗口，同时是 passed 要求的每平台最小持续 HOLD 时长。
hold_min_duration_s: 0.5

# 目标力曲线：2→4→6→8→6→4→2 N 共 7 个平台。
# 首个平台为辨识预留 2.5 s，其余平台保持 1.5～2.0 s，过渡段均为 1.0 s。
reference:
  interpolation: linear
  waypoints:
    - {t_s: 0.0, force_n: 2.0}
    - {t_s: 2.5, force_n: 2.0}
    - {t_s: 3.5, force_n: 4.0}
    - {t_s: 5.0, force_n: 4.0}
    - {t_s: 6.0, force_n: 6.0}
    - {t_s: 7.5, force_n: 6.0}
    - {t_s: 8.5, force_n: 8.0}
    - {t_s: 10.5, force_n: 8.0}
    - {t_s: 11.5, force_n: 6.0}
    - {t_s: 13.0, force_n: 6.0}
    - {t_s: 14.0, force_n: 4.0}
    - {t_s: 15.5, force_n: 4.0}
    - {t_s: 16.5, force_n: 2.0}
    - {t_s: 18.5, force_n: 2.0}

# 离散命令空间与接近策略。
control:
  # tendon actuator 的整数命令范围，对应 0～255。
  command_min: 0
  command_max: 255
  # 非零动作的最小 tick 数（schema 固定为 1；动态步长在此基础上放大）。
  min_nonzero_step: 1
  # 动态步长变体的单次动作上限。
  max_dynamic_step: 3
  # 安全力上限，超过即进入 RELEASE。
  max_force_n: 10.0
  # 接近阶段使用粗动作并限制动作间隔，避免执行器未响应时连续排入。
  approach_step: 3
  approach_action_interval_s: 0.05
  # 接触判定力阈值，达到后从 APPROACH 转入稳定等待。
  contact_threshold_n: 0.2

# 局部稳定力估计：窗口内力范围足够小且经过最短稳定时间，才接受新的稳定力。
force_estimation:
  # 参与稳定判定的滤波力样本数。
  stable_window_samples: 20
  # 稳定判定要求窗口内力的极差小于该值。
  stable_force_range_n: 0.10
  # 动作后至少经过该时间才允许接受稳定力。
  min_settle_time_s: 0.20
  # 力低通滤波的截止频率。
  filter_cutoff_hz: 20.0

# 单 tick 力增量（ΔF_tick）的在线 EWMA 估计。
delta_f_tick:
  # EWMA 系数 λ。
  ema_alpha: 0.30
  # 首批有效样本积累完成前只允许单 tick 调节。
  min_valid_samples: 3
  # 单次动作观测被接受为有效样本的最小力增量，用于滤除噪声引起的过小差值。
  minimum_value_n: 0.02

# HOLD 死区 ε_hold：fixed-step 用固定死区，自适应变体取 max(c_σ·σ_F, α·ΔF_tick)。
deadband:
  fixed_n: 0.15
  noise_sigma_factor: 3.0
  tick_factor_alpha: 0.60

# 再激活阈值 ε_react：固定变体加固定裕量，自适应变体加 β·ΔF_tick。
# HOLD 中偏差需连续超过该阈值 duration_s 才返回 ADJUST。
reactivation:
  fixed_margin_n: 0.10
  tick_factor_beta: 0.70
  duration_s: 0.20

# 一步预测的动作裕量：预测误差连同噪声/局部增益裕量严格小于当前误差才动作。
prediction:
  noise_factor: 2.0
  tick_margin_factor: 0.20

# 动态步长增益 η：n = clip(⌊η·|e|/ΔF_tick⌋, 1, max_dynamic_step)。
dynamic_step:
  eta: 0.60

# 安全力裕量：夹紧步长按 (max_force_n − margin − 当前力)/ΔF_tick 收缩。
safety:
  force_margin_n: 0.30

# 连续量化 PI 对照的增益与每周期命令增量上限。
quantized_pi:
  kp_tick_per_n: 0.8
  ki_tick_per_n_s: 0.2
  max_step_per_update: 3.0
