# @package _global_
defaults:
  - /experiment/dm_gripper/unified_step_load_multirate
  - _self_

experiment:
  name: dm_unified_step_load_risk
task:
  definition:
    unified_adaptive:
      risk_enabled: true
      friction_update_enabled: true
      friction_quality_min: 0.4
      risk_step_n: 1.0
      risk_rate_n_s: 50.0
      risk_repeat_interval_s: 0.1
      risk_budget_n: 12.0
      risk_max_events: 12
      risk_duration_s: 20.0
      observer:
        window_s: 0.04
        confirmation_s: 0.012
        cooldown_s: 0.1
        allow_steady_load_risk: true
        stable_contact_subset: true
