# @package _global_
defaults:
  - override /platform: dm_gripper/simulation
  - override /model: dm_gripper/height_spheres
  - override /controller: dm_gripper/admittance
  - override /estimator: none
  - override /scheduler: force/adaptive
  - override /task: load/support_release
  - override /material: hard
  - override /execution: run
  - _self_

experiment:
  name: dm_adaptive_support_release
  kind: force_scheduling

scheduler:
  definition:
    load:
      min_force_n: 1.0
      # 仿真快速响应候选；不作为真机已验证的增力能力。
      max_force_rate_n_s: 50.0
