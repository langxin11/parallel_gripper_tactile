# @package task
family: friction_estimation
path: configs/task/friction_estimation/low_friction.yaml
definition:
  schema_version: 1
  name: low_friction_probe
  
  # 低摩擦接触用于验证探测器能较早停止，并且估计值不会高于真值。
  cube_mass_kg: 0.05
  friction_coefficient: 0.35
  object_material: hard
  sensor_noise_scale: 1.0
  
  approach:
    duration_s: 1.0
    timeout_s: 3.0
    settle_after_contact_s: 0.3
    feedforward_force_n: 1.0
  
  probe:
    normal_force_n: 1.0
    settle_after_release_s: 0.3
    force_rate_n_s: 0.5
    max_force_n: 3.0
    hold_at_max_s: 0.2
    recovery_s: 0.5
    recovery_normal_force_n: 2.0
  
  estimator:
    window_size: 60
    min_samples: 20
    estimate_quantile: 0.85
    safety_discount: 0.9
    fallback_friction_coefficient: 0.15
    min_friction_coefficient: 0.05
    max_friction_coefficient: 2.0
    min_probe_load_n: 0.2
    min_total_normal_force_n: 0.2
    support_residual_threshold_n: 0.04
    support_utilization_threshold: 0.97
    mismatch_confirm_s: 0.012
    ratio_trend_enabled: true
    trend_window_size: 60
    arming_slope_threshold_per_s: 0.09
    saturation_slope_threshold_per_s: 0.055
    max_side_ratio_difference: 0.1
  
  taxel_observer:
    contact_enter_force_n: 0.05
    contact_exit_force_n: 0.025
    transition_confirm_s: 0.01
  
  taxel_slip_detector:
    window_size: 200
    min_ratio: 0.1
    arming_ratio_increase: 0.05
    saturation_ratio_increase: 0.005
    redistribution_share_drop: 0.05
    min_side_shear_increase_n: 0.03
    confirm_s: 0.03
    estimate_quantile: 0.8
    safety_discount: 0.8
  
  scheduler:
    safety_factor: 1.5
    min_force_n: 0.5
    max_force_n: 8.0
    max_force_rate_n_s: 2.0
    friction_floor: 0.05
  
  downward_load:
    interpolation: linear
    waypoints:
      - {t_s: 0.0, force_n: 0.0}
      - {t_s: 1.0, force_n: 0.0}
      - {t_s: 4.0, force_n: 0.8}
      - {t_s: 5.0, force_n: 0.8}
  
  metrics:
    require_detection: true
    conservative_tolerance: 0.02
    minimum_estimate_ratio: 0.55
    probe_slip_threshold_m: 0.002
    hold_slip_threshold_m: 0.002
    force_rmse_threshold_n: 0.5
    ignore_hold_initial_s: 0.2
  
  # 不启用 noslip 时，软接触的锥内数值爬移会污染 μ 辨识。
  solver:
    noslip_iterations: 5
  
  control_period_s: 0.002
