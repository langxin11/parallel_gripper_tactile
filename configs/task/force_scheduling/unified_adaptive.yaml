# @package task
family: force_scheduling
path: configs/task/force_scheduling/unified_adaptive.yaml
definition:
  schema_version: 1
  name: unified_adaptive
  cube_mass_kg: 0.05
  friction_coefficient: 0.8
  object_material: hard
  unified_adaptive:
    # 先验证共享闭环与诊断，检测和摩擦更新的控制权限独立开放。
    risk_enabled: false
    friction_update_enabled: false
    load:
      left_friction: 0.6
      right_friction: 0.6
      safety_factor: 1.5
      min_force_n: 0.5
      max_force_n: 8.0
      max_force_rate_n_s: 1.0
  downward_load:
    interpolation: linear
    waypoints:
      - {t_s: 0.0, force_n: 0.0}
      - {t_s: 1.0, force_n: 0.0}
      - {t_s: 5.0, force_n: 2.0}
      - {t_s: 7.0, force_n: 2.0}
  control_period_s: 0.004
