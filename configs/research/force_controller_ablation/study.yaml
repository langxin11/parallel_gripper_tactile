# @package _global_
# 目的导向研究定义；本文件同时拥有研究元数据与唯一条件矩阵。
study:
  kind: force_tracking_ablation
  source: configs/research/force_controller_ablation/study.yaml
  profile:
    experiment: dm_gripper/force_tracking_default
    # 基础控制配置用于预检；单任务、配对 seed 和输出目录在各自唯一字段中声明。
    overrides: [controller=dm_gripper/full, estimator=window_linear]
  rationale:
    question: PID、刚度位置前馈与力矩前馈各自贡献多大？
    decision: 确定默认 PID 控制器必须保留的模块。
    inclusion_criteria: [只改变被消融模块, 共享同一任务与配对 seed]
    task_rationale: 默认 waypoint 同时包含升降载荷与保持段，便于观察模块贡献。
    primary_metrics: [RMSE, 峰值误差, 力矩饱和率]
    stop_conditions: [完成四控制器乘三材料乘三 seed]
    exclusions: {direct-torque: 该控制器改变控制结构，不属于 PID 模块消融。}
  definition:
    name: force_tracking_ablation
    task: configs/task/force_tracking/default_waypoints.yaml
    # PID 模块消融研究的官方矩阵定义：单任务下对不同控制器、材料和 seed 做完整交叉。
    controllers:
      - pid-only
      - pid-torque-ff
      - pid-stiffness-ff
      - full
    # 固定三类接触 preset，用于控制器行为对材料刚度的敏感性比较。
    materials:
      - medium
      - hard
      - stiff
    # 以固定随机种子段落复现实验噪声影响。
    seeds:
      start: 0
      count: 3
