# Hydra 单次研究入口，默认执行 DM 直接力矩 ADRC 的 Ramp 曲线。
defaults:
  - platform: dm/simulation
  - controller: dm/adrc_torque
  - estimator: window_linear
  - task: ramp
  - material: hard
  - execution: run
  - _self_

schema_version: 1
experiment: force_tracking
seed: 0

hydra:
  job:
    chdir: false
  run:
    dir: ${execution.output_root}/run/${now:%Y%m%dT%H%M%S%f}
  sweep:
    dir: ${execution.output_root}/multirun/${now:%Y%m%dT%H%M%S%f}
    subdir: ${hydra.job.num}
