# @package _global_
study:
  kind: stiffness_ground_truth_validation
  source: configs/research/stiffness_ground_truth_validation/study.yaml
  profile:
    experiment: dm_gripper/force_tracking_default
    overrides: [controller=dm_gripper/pid_torque_ff, estimator=window_linear]
  rationale:
    question: 三种在线估计器相对准静态局部切线刚度参考的精度、抖动和低估风险如何？
    decision: 为轻柔接触的刚度安全约束选择在线估计方法。
    inclusion_criteria: [独立位置扫描, 无噪声参考力, 相同加载卸载工作点, 材料与 seed 配对]
    task_rationale: 准静态加载与卸载中心差分隔离动态阻尼，并显式检查迟滞。
    primary_metrics: [对数 RMSE, 相对偏差, 低估率, 相邻平衡点力增量误差, 估计抖动, 有效比例]
    stop_conditions: [完成三估计器乘三材料乘三 seed]
    exclusions:
      跟踪 RMSE: 只评价下游控制表现，不能作为刚度估计真值误差。
  definition:
    name: stiffness_ground_truth_validation
    task: configs/task/stiffness_calibration/quasistatic.yaml
    estimators: [secant_ewma, window_linear, window_quadratic]
    materials: [medium, hard, stiff]
    seeds:
      start: 0
      count: 3
