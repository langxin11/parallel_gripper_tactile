  rationale:
    question: 哪组导纳接近与接触切换参数能稳定完成低力 Ramp？
    decision: 选择共享导纳链路的默认切换参数。
    inclusion_criteria: [固定二阶导纳主体, 固定 2 Hz 滤波, 扫描切换参数]
    task_rationale: 低力线性 Ramp 能直接暴露切换峰值和跟踪完整度。
    primary_metrics: [原始侧力峰值, RMSE, force_tracking 占比]
    stop_conditions: [完成十六候选乘两个 seed, force_tracking 占比不低于 0.995]
    exclusions: {控制器选型矩阵: 本研究是调参，不与 PID 或 ADRC 选型合并。}
  definition:
    # DMgripper 二阶导纳的最小可复现 Ramp 参数调优；不进入默认控制器比较矩阵。
    name: dm_admittance_tuning
