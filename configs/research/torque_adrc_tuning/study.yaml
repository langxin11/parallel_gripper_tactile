# @package _global_
# 目的导向研究定义；本文件同时拥有研究元数据与唯一条件矩阵。
study:
  kind: force_tracking_torque_adrc_tuning
  source: configs/research/torque_adrc_tuning/study.yaml
  profile:
    experiment: dm_gripper/force_tracking_default
    # 这里只固定调参所基于的控制配置；任务和阶段条件由 definition 唯一生成。
    overrides: [controller=dm_gripper/full, estimator=window_linear]
  stage: coarse
  coarse_study_dir: null
  rationale:
    question: 二阶直接力矩 ADRC 的可行带宽组合及其跨条件稳健性是什么？
    decision: coarse 筛出可行候选，confirm 只复验前五并保留基线。
    inclusion_criteria: [满足测量带宽约束, coarse 排名可追溯, confirm 绑定已完成 coarse]
    task_rationale: 三类力曲线先低成本粗筛，再跨材料和 seed 确认。
    primary_metrics: [Step 超调, Ramp RMSE, Mixed RMSE, 力矩饱和率]
    stop_conditions: [coarse 完成 102 条, confirm 仅在谱系校验通过后启动]
    exclusions: {direct-torque: 已有明显较差证据，不参与调参候选。}
  definition:
    name: force_tracking_torque_adrc_tuning
    tasks:
      - configs/task/force_tracking/step.yaml
      - configs/task/force_tracking/ramp.yaml
      - configs/task/force_tracking/mixed.yaml
    stiffness_estimator_method: secant_ewma
    
    # 当前正式 benchmark 使用的参数，始终作为连续任务性能约束的参照。
    baseline:
      measurement_filter_cutoff_hz: 40.0
      controller_bandwidth_rad_s: 60.0
      observer_bandwidth_ratio: 4.0
    
    # 粗扫只使用一个材料和固定随机种子，先剔除明显不合适的带宽组合。
    coarse:
      materials: [medium]
      seeds: {start: 0, count: 1}
      measurement_filter_cutoffs_hz: [30.0, 40.0, 60.0]
      controller_bandwidths_rad_s: [30.0, 40.0, 50.0, 60.0]
      observer_bandwidth_ratios: [2.0, 3.0, 4.0]
    
    # 确认阶段从粗扫的可行候选中选前五个，并在三种接触 preset、三种 seed 上复验。
    confirm:
      materials: [medium, hard, stiff]
      seeds: {start: 0, count: 3}
      measurement_filter_cutoffs_hz: [30.0, 40.0, 60.0]
      controller_bandwidths_rad_s: [30.0, 40.0, 50.0, 60.0]
      observer_bandwidth_ratios: [2.0, 3.0, 4.0]
    confirm_top_candidates: 5
    
    constraints:
      max_torque_saturation_ratio: 0.01
      max_ramp_rmse_ratio_to_baseline: 1.10
      max_mixed_rmse_ratio_to_baseline: 1.10
