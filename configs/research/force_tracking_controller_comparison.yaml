# @package _global_
# 以正式控制器对比矩阵作为默认入口：正式 study 不在此展开矩阵，而由下游 study 协议读取 domain.yaml。
defaults:
  - study: force_tracking_controller_comparison
  - study_execution: plan
  - _self_

schema_version: 1

hydra:
  job:
    chdir: false
  run:
    dir: ${execution.output_root}/${study.kind}/${now:%Y%m%dT%H%M%S%f}
