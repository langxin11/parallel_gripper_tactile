# @package _global_
# 目的导向研究定义；本文件同时拥有研究元数据与唯一条件矩阵。
study:
  kind: force_tracking_controller_comparison
  source: configs/research/dm_force_controller_selection/study.yaml
  profile:
    experiment: dm_gripper/force_tracking
    # 这里只选择矩阵共享的基础控制配置；任务、seed 和执行方式分别归 definition 与 execution 所有。
    overrides: [controller=dm_gripper/pid_torque_ff, estimator=window_linear]
  rationale:
    question: 哪种仍有竞争力的 DM 力控制器在任务与材料变化下表现最佳？
    decision: 选择后续正式实验的默认控制器。
    inclusion_criteria: [代表必要基线, 当前结果仍有竞争力, 能回答跨任务稳健性]
    task_rationale: Step、Ramp 与 Mixed 分别覆盖瞬态、连续变化及复合保持。
    primary_metrics: [RMSE, 超调, 调节时间, 力矩饱和率]
    stop_conditions: [完成全部配对条件, 任一执行异常须单独登记]
    exclusions:
      direct-torque: 历史 135-run 证据显示跨任务 RMSE 分别恶化约 37.7%、204.5% 与 121%，配置入口已移除。
      adrc: 一阶位置式模型阶次不匹配，配置入口已移除。
      pid-stiffness-limit: 250 Hz stiff Step 出现约 0.326 N 平台标准差和明显极限环，不进入最终比较。
  definition:
    name: force_tracking_controller_comparison
    tasks:
      - configs/task/force_tracking/step.yaml
      - configs/task/force_tracking/ramp.yaml
      - configs/task/force_tracking/mixed.yaml
    controllers:
      - pid-only
      # pid-torque-ff 为位置式 PID 基线代表。
      - pid-torque-ff
      - pid-stiffness-rate
      # 一阶位置式 adrc 因模型阶次不匹配，不再参加默认正式矩阵；CLI 配置入口已移除，
      # 变体派生仍保留在代码层。
      # adrc-torque 为二阶直接力矩 MB-ADRC。
      - adrc-torque
      # 二阶导纳不消费刚度估计；protocol 为该条件显式记录 estimator=none。
      - admittance
    # 非导纳控制结构统一固定 window_linear；历史基准按其 manifest 解释。
    stiffness_estimator_method: window_linear
    # 参数与 controller=dm_gripper/admittance 及仿真平台机械边界保持一致，并随 StudyPlan 冻结。
    admittance:
      mass_kg: 0.2
      damping_ns_m: 15.0
      stiffness_n_m: 1.0
      feedforward_ratio: 1.0
      contact_stable_time_s: 0.0
      contact_transition_time_s: 0.05
      approach_velocity_rad_s: 0.05
      approach_acceleration_rad_s2: 0.5
      approach_jerk_rad_s3: 2.0
      approach_feedforward_force_n: 0.5
      approach_feedforward_ratio: 1.0
      position_min_rad: 0.0
      position_max_rad: 1.5707963267948966
      velocity_limit_rad_s: 0.3
      closing_direction: 1
      feedforward_torque_limit_nm: 4.0
      mit_torque_limit_nm: 4.0
    materials:
      - medium
      - hard
      - stiff
    seeds:
      start: 0
      count: 3
