# @package _global_
# 目的导向研究定义；本文件同时拥有研究元数据与唯一条件矩阵。
study:
  kind: force_tracking_stiffness_estimator_comparison
  source: configs/research/stiffness_estimator_validation/study.yaml
  profile:
    experiment: dm_gripper/force_tracking_default
    # 固定控制器基线；待比较任务、估计器和 seed 只在矩阵中维护。
    overrides: [controller=dm_gripper/full, estimator=window_linear]
  rationale:
    question: 三种刚度估计器对位置前馈力跟踪的影响是什么？
    decision: 判断估计器差异是否会显著改变下游力跟踪；估计精度由独立真值研究决定。
    inclusion_criteria: [同一控制器, 同一任务材料 seed 配对, 仅替换估计器]
    task_rationale: Step、Ramp 与 Mixed 覆盖估计器对瞬态和连续变化的响应。
    primary_metrics: [力跟踪 RMSE, MAE, 峰值误差, 输出限幅占比]
    stop_conditions: [完成三估计器乘三任务乘三材料乘三 seed]
    exclusions:
      估计精度: 本研究没有独立 k_ref，不用于判断哪种估计器最准确。
  definition:
    name: force_tracking_stiffness_estimator_comparison
    # 刚度估计器消融研究：仅比较 secant_ewma / window_linear / window_quadratic 三套估计器。
    tasks:
      - configs/task/force_tracking/step.yaml
      - configs/task/force_tracking/ramp.yaml
      - configs/task/force_tracking/mixed.yaml
    # 研究目标是评估同一控制策略下估计器差异对动力学跟踪的影响。
    estimators:
      - secant_ewma
      - window_linear
      - window_quadratic
    # 仅跨三种接触 preset 执行，与其他控制变量隔离。
    materials:
      - medium
      - hard
      - stiff
    # 固定三种随机种子，便于与官方基线复现。
    seeds:
      start: 0
      count: 3
