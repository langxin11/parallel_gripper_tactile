# @package _global_
# 目的导向研究定义；本文件同时拥有研究元数据与唯一条件矩阵。
study:
  kind: force_tracking_controller_comparison
  source: configs/research/force_controller_selection/study.yaml
  profile:
    experiment: dm_gripper/force_tracking_default
    # 这里只选择矩阵共享的基础控制配置；任务、seed 和执行方式分别归 definition 与 execution 所有。
    overrides: [controller=dm_gripper/full, estimator=window_linear]
  rationale:
    question: 哪种仍有竞争力的 DM 力控制器在任务与材料变化下表现最佳？
    decision: 选择后续正式实验的默认控制器。
    inclusion_criteria: [代表必要基线, 当前结果仍有竞争力, 能回答跨任务稳健性]
    task_rationale: Step、Ramp 与 Mixed 分别覆盖瞬态、连续变化及复合保持。
    primary_metrics: [RMSE, 超调, 调节时间, 力矩饱和率]
    stop_conditions: [完成全部配对条件, 任一执行异常须单独登记]
    exclusions:
      direct-torque: 历史 135-run 证据显示跨任务 RMSE 分别恶化约 37.7%、204.5% 与 121%，仅保留独立复现。
      adrc: 一阶位置式模型阶次不匹配，仅保留独立复现。
  definition:
    name: force_tracking_controller_comparison
    tasks:
      - configs/task/force_tracking/step.yaml
      - configs/task/force_tracking/ramp.yaml
      - configs/task/force_tracking/mixed.yaml
    controllers:
      - pid-only
      - pid-torque-ff
      - pid-stiffness-ff
      - full
      # direct-torque 为位置式 MIT 力控的直接力矩式对照；矩阵由 108 扩至 135 条。
      # 2026-09-01 历史 108-run 基准的复现以当时 manifest 与本文件 git 历史为准。
      #- direct-torque
      - pid-stiffness-limit
      # 一阶位置式 adrc 因模型阶次不匹配，不再参加默认正式矩阵；保留 CLI 供历史复现。
      # adrc-torque 为二阶直接力矩 MB-ADRC；默认矩阵为 162 条。
      - adrc-torque
    # 2026-09-01 的 108-run 基准使用相邻点割线估计；显式锁定以保证结果可复现。
    stiffness_estimator_method: secant_ewma
    materials:
      - medium
      - hard
      - stiff
    seeds:
      start: 0
      count: 3
