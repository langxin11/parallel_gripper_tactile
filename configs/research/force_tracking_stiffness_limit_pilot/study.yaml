# @package _global_
study:
  kind: force_tracking_stiffness_limit
  source: configs/research/force_tracking_stiffness_limit_pilot/study.yaml
  profile:
    experiment: dm_gripper/force_tracking
    overrides: [controller=dm_gripper/pid_torque_ff, estimator=window_linear]
  rationale:
    question: 刚度位置限幅能否降低阶跃跟踪初段的峰值与实际力增长率，同时保持可接受的跟踪误差？
    decision: 判断 pid-stiffness-limit 是否进入自适应轻柔抓取主线。
    inclusion_criteria: [相同 PID 与机构力矩前馈, window_linear 固定默认, 三臂按材料与 seed 配对]
    task_rationale: 首轮只用 Step 快速暴露峰值、增长率与跟踪速度之间的取舍；1000 Hz 物理步进与 250 Hz 外环解耦。
    primary_metrics: [接触后局部峰值, 最大正力增长率, RMSE, 超调, 限幅介入率]
    stop_conditions: [完成三模式乘三材料乘三 seed 共 27 条条件]
    exclusions:
      初次接触峰值: 限幅仅在力跟踪状态生效，该指标用于验证边界，不预设一定改善。
      oracle-k: 仅使用准静态扫描冻结的材料级参考，不代表动态瞬时真值。
  definition:
    name: force_tracking_stiffness_limit_pilot
    tasks: [configs/task/force_tracking/step.yaml]
    modes: [no-limit, window-linear, oracle-k]
    materials: [medium, hard, stiff]
    seeds:
      start: 0
      count: 3
    # 来自独立准静态参考研究的材料级均值；数值随 study 定义一起进入科学配置哈希。
    oracle_stiffness_n_per_m:
      medium: 505.5748918579964
      hard: 888.5641152820184
      stiff: 1589.0337698017527
    contact_peak_window_s: 0.2
    position_limit_force_rate_n_s: 50.0
