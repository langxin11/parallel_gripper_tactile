# @package _global_
# 将 `force_tracking_stiffness_estimator_comparison.yaml` 声明为默认 plan 场景，后续可通过 study_execution=run 切换执行。
defaults:
  - study: force_tracking_stiffness_estimator_comparison
  - study_execution: plan
  - _self_

schema_version: 1

hydra:
  job:
    chdir: false
  run:
    dir: ${execution.output_root}/${study.kind}/${now:%Y%m%dT%H%M%S%f}
