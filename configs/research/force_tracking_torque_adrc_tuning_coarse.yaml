# @package _global_
# 两阶段调参第一阶段（coarse）默认入口：先完成可行域筛选，再在 confirm 阶段复验。
defaults:
  - study: force_tracking_torque_adrc_tuning_coarse
  - study_execution: plan
  - _self_

schema_version: 1

hydra:
  job:
    chdir: false
  run:
    dir: ${execution.output_root}/${study.kind}/${study.stage}/${now:%Y%m%dT%H%M%S%f}
