# @package _global_
study:
  kind: force_tracking_stiffness_rate_confirmation
  source: configs/research/force_tracking_stiffness_rate_confirmation/study.yaml
  profile:
    experiment: dm_gripper/force_tracking
    overrides: [controller=dm_gripper/pid_stiffness_rate, estimator=window_linear]
  rationale:
    question: 调优胜出的刚度速率候选能否在固定 250 Hz 外环和不同材料刚度下保持稳定且受控的力增长？
    decision: 判断候选参数是否冻结并进入最终控制器比较。
    inclusion_criteria: [固定 KI=KD=0, 固定 250 Hz Step, 三种正式材料, 三 seed 配对, 保留位置式 PID 性能基线]
    task_rationale: Step 任务以最小矩阵同时暴露瞬态、平台振荡和材料敏感性。
    primary_metrics: [RMSE, 超调, 平台力标准差, 最大正力增长率, 主振荡幅值]
    stop_conditions: [完成两控制器乘三材料乘三 seed 共 18 条条件]
    exclusions:
      多任务泛化: Ramp 与 Mixed 留给最终控制器比较，本轮只确认参数能否冻结。
      参数再搜索: 本轮只复验调优排名第一的候选，不根据确认结果继续扩张参数网格。
  definition:
    name: force_tracking_stiffness_rate_confirmation
    analysis_mode: confirmation
    tasks: [configs/task/force_tracking/step.yaml]
    stiffness_estimator_method: window_linear
    materials: [medium, hard, stiff]
    seeds: {start: 0, count: 3}
    kp_s_inv: [20.0]
    max_force_rate_n_s: [50.0]
    max_joint_velocity_rad_s: 0.5
    max_plateau_force_std_n: 0.03
    max_overshoot_ratio: 0.10
    steady_window_s: [1.4, 2.9]
