# @package _global_
# 将 `force_tracking_diagnosis.yaml` 声明为默认 plan 场景，study.phase 选择诊断阶段，
# study_execution=run 切换执行；逐 phase 一次调用，替代原 --phase all 循环。
defaults:
  - study: force_tracking_diagnosis
  - study_execution: plan
  - _self_

schema_version: 1

hydra:
  job:
    chdir: false
  run:
    dir: ${execution.output_root}/${study.kind}/${study.phase}/${now:%Y%m%dT%H%M%S%f}
