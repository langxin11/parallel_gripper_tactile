# @package _global_
# 目的导向研究定义；本文件同时拥有研究元数据与唯一条件矩阵。
study:
  kind: force_tracking_diagnosis
  source: configs/research/archive/model_bug_diagnosis/study.yaml
  profile:
    experiment: dm_gripper/force_tracking_default
    overrides: [controller=dm_gripper/full, estimator=window_linear, task=force_tracking/default_waypoints, seed=20260814, execution=plan]
  phase: collision-geometry
  rationale:
    question: 历史异常是否由碰撞几何、multiccd 或接触语义引起？
    decision: 仅用于解释并复现模型 bug，不参与论文正式控制器比较。
    inclusion_criteria: [一次只改变一个诊断因素, 固定 seed, 保留原始端点]
    task_rationale: 默认 waypoint 提供已知会暴露历史异常的统一轨迹。
    primary_metrics: [RMSE, 接触数量, 力峰值, 数值稳定性]
    stop_conditions: [定位原因并验证修复后归档, 默认自动化不得运行]
    exclusions: {正式矩阵: 碰撞几何问题已由 height-sphere 修复，证据见 20260904T080635Z-f4cd4ddf 与提交 37cc30e。}
  definition:
    name: force_tracking_diagnosis
    # 归档诊断必须保留历史原始 profile 路径，用于改写碰撞模型并复现旧端点。
    profile: configs/dm_gripper.yaml
    task: configs/task/force_tracking/default_waypoints.yaml
    
    # 固定 seed，使各 phase 构成可直接比较的因果实验。
    sensor_noise_seed: 20260814
    reproducibility_repeats: 2
    
    controllers:
      - pid-only
      - pid-torque-ff
      - pid-stiffness-ff
      - full
    materials:
      - medium
      - hard
      - stiff
    
    # 仅用于诊断的载荷扫描：倍率缩放双侧平均力目标，不改变 waypoint 或反馈力语义。
    force_scales: [0.5, 0.625, 0.75, 0.875, 1.0]
    contact_models: [explicit, legacy]
    
    # 五个条件隔离原始高度差、mesh／sphere 拓扑与 multiccd 三个因素；首尾保留原 A/B 端点，
    # 中间三个条件作为新增因果对照。
    collision_geometry_models:
      - label: original-mesh-multiccd
        model: assets/grippers/dm_gripper/parallel_gripper_prepared.xml
        multiccd_enabled: true
      - label: height-spheres-multiccd
        model: assets/grippers/dm_gripper/parallel_gripper_height_sphere_collision.xml
        multiccd_enabled: true
      - label: coplanar-mesh-multiccd
        model: assets/grippers/dm_gripper/parallel_gripper_coplanar_mesh_collision.xml
        multiccd_enabled: true
      - label: original-mesh-single-contact
        model: assets/grippers/dm_gripper/parallel_gripper_prepared.xml
        multiccd_enabled: false
      - label: coplanar-spheres-multiccd
        model: assets/grippers/dm_gripper/parallel_gripper_flat_sphere_collision.xml
        multiccd_enabled: true
    
    # 高载稳定性按顺序扫描；每个 phase 只改变一个值，选定条件后再作为下一 phase 的基线。
    stability_controller: pid-torque-ff
    position_adjustment_limits_rad: [0.15, 0.10, 0.075, 0.05, 0.03]
    integral_gains: [0.2, 0.1, 0.05, 0.025, 0.0]
    filter_cutoffs_hz: [20.0, 30.0, 40.0, 60.0]
