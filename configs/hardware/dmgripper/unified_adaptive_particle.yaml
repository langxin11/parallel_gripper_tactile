# 粒子摩擦后验的离线回放／受控试验配置；默认值即主力 unified_adaptive profile，
# 本文件只写与主力的真差异。先用连续抓取记录回放检查后验、触点门禁和目标变化，
# 再决定是否进行有人值守的真机试验。
metadata:
  task_name: unified-adaptive-particle
  object_name: object
hardware:
  dm_port: /dev/dmj4310_can
  tactile_port: /dev/papillarray
timing:
  # 100 Hz 控制；单周期超时容纳已观测的单次 130 ms 主机抖动，仍早于触觉超时。
  control_rate_hz: 100.0
  max_control_gap_s: 0.15
safety:
  # 压缩上限较主力收紧：粒子路线面向低力受控试验。
  max_contact_compression_m: 0.020
lifecycle:
  # 刚度辨识预载：锁定接触底力；以下边界仍需按实际物体耐受验证。
  stiffness_preload:
    min_force_n: 0.5
    probe_force_n: 0.5
reference:
  # 启动目标低于主力，配合更低的调度下限。
  initial_force_n: 0.5
  experimental_closed_loop: true
  unified:
    estimator: particle
    friction:
      safety_factor: 1.2
      min_event_taxels: 4
    observer:
      # 软物体会把约 0.4 N 整侧载荷分散到多个 pillar；0.08 仍高于零载最大残差 0.075 N。
      min_normal_n: 0.08
    depth_friction_prior:
      # 全部取默认值，显式写出以表明粒子先验均值由深度锁定初始化。
      min_friction: 0.1
      max_friction: 0.6
      onset_depth_m: 0.0002
      saturation_depth_m: 0.002
      curvature: 2.0
      min_contact_taxels: 4
      stable_time_s: 0.2
      depth_tolerance_m: 0.0001
      max_increase_per_s: 0.05
    particle_friction:
      # 每侧独立 256 个一维摩擦粒子；固定种子便于对同一触觉记录复现后验。
      seed: 23
controller:
  # MIT 位置和速度参考均跟随导纳输出（主力为零速阻尼模式）。
  zero_tracking_velocity: false
  admittance:
    # 局部模型候选外环参数，不代表已测得内环带宽或通过真机稳定性验收。
    max_closing_velocity_m_s: 0.010
    max_opening_velocity_m_s: 0.005
    max_acceleration_m_s2: 0.050
    stiffness_adaptation:
      bandwidth_rad_s: 10.0
      damping_ratio: 1.0
      filter_tau_s: 0.2
      relative_rate_per_s: 1.0
      min_mass_kg: 0.2
      max_mass_kg: 300.0
      max_estimate_age_s: 0.2
