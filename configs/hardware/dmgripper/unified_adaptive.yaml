# 通用自适应抓取主力入口：持续在线摩擦与接触刚度估计，人工释放结束抓取。
# 默认流程：预检 → 等待 start → 建立抓力 → active 持续估计 → release 回位。
# 本文件只写实验身份与真差异；稳定参数由 dataclass 默认承载（即本主力 profile），
# 派生量（调度包络上限、最低力、速率边界）由 safety 与初始目标在构造期生成。
# 任一使能后的正常阶段均可输入 release；触觉或控制故障先进入 fault_holding。
metadata:
  task_name: unified-adaptive
  object_name: object
hardware:
  dm_port: /dev/dmj4310_can
  tactile_port: /dev/papillarray
safety:
  # 唯一限幅定义点；所有力均为平均单侧法向力 N，不是双侧总法向力。
  max_target_force_n: 30.0
  force_ceiling_n: 40.0
  max_contact_compression_m: 0.040
  max_force_rate_n_s: 10.0
  max_force_decrease_rate_n_s: 1.0
  approach_feedforward_force_n: 1.0
reference:
  # 本配置仅授权当前未验收的受控闭环试验，不冒充风险或摩擦真机验收。
  experimental_closed_loop: true
  unified:
    estimator: depth_prior
    depth_friction_prior:
      # 深度由实测关节角换算总闭合量减去首次双侧接触闭合量；左右共用同一压缩量。
      # 只在 active 可靠接触窗口后锁定一次，随后由摩擦证据更新。
      max_friction: 0.8
      max_increase_per_s: null
