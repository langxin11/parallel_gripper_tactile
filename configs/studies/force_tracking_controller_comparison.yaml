name: force_tracking_controller_comparison
profile: ../custom_parallel_gripper.yaml
tasks:
  - ../force_tracking/step.yaml
  - ../force_tracking/ramp.yaml
  - ../force_tracking/mixed_waypoints.yaml
controllers:
  - pid-only
  - pid-torque-ff
  - pid-stiffness-ff
  - full
  # direct-torque 为位置式 MIT 力控的直接力矩式对照；矩阵由 108 扩至 135 条。
  # 2026-09-01 历史 108-run 基准的复现以当时 manifest 与本文件 git 历史为准。
  - direct-torque
  # 一阶位置式 adrc 因模型阶次不匹配，不再参加默认正式矩阵；保留 CLI 供历史复现。
  # adrc-torque 为二阶直接力矩 MB-ADRC；默认矩阵为 162 条。
  - adrc-torque
# 2026-09-01 的 108-run 基准使用相邻点割线估计；显式锁定以保证结果可复现。
stiffness_estimator_method: secant_ewma
materials:
  - medium
  - hard
  - stiff
seeds:
  start: 0
  count: 3
output_root: ../../outputs/studies
