name: force_tracking_diagnosis
profile: ../custom_parallel_gripper.yaml
task: ../force_tracking/default_waypoints.yaml
output_root: ../../outputs/studies

# A fixed seed turns each phase into a causal, directly comparable experiment.
sensor_noise_seed: 20260814
reproducibility_repeats: 2

controllers:
  - pid-only
  - pid-torque-ff
  - pid-stiffness-ff
  - full
materials:
  - medium
  - hard
  - stiff

# Diagnostic load sweep only: factors scale average-side task references and do
# not change the waypoint or feedback force semantics.
force_scales: [0.5, 0.625, 0.75, 0.875, 1.0]
contact_models: [explicit, legacy]

# Five conditions isolate three factors: original height variation, mesh versus
# sphere topology, and multiccd.  The first and last conditions retain the
# original A/B endpoints; the middle three are the added causal controls.
collision_geometry_models:
  - label: original-mesh-multiccd
    model: ../../assets/grippers/custom_parallel_gripper/parallel_gripper_prepared.xml
    multiccd_enabled: true
  - label: height-spheres-multiccd
    model: ../../assets/grippers/custom_parallel_gripper/parallel_gripper_height_sphere_collision.xml
    multiccd_enabled: true
  - label: coplanar-mesh-multiccd
    model: ../../assets/grippers/custom_parallel_gripper/parallel_gripper_coplanar_mesh_collision.xml
    multiccd_enabled: true
  - label: original-mesh-single-contact
    model: ../../assets/grippers/custom_parallel_gripper/parallel_gripper_prepared.xml
    multiccd_enabled: false
  - label: coplanar-spheres-multiccd
    model: ../../assets/grippers/custom_parallel_gripper/parallel_gripper_flat_sphere_collision.xml
    multiccd_enabled: true

# Sequential high-load stability sweeps. Each phase changes only one value; once
# a condition is selected, make it the profile baseline before running the next phase.
stability_controller: pid-torque-ff
position_adjustment_limits_rad: [0.15, 0.10, 0.075, 0.05, 0.03]
integral_gains: [0.2, 0.1, 0.05, 0.025, 0.0]
filter_cutoffs_hz: [20.0, 30.0, 40.0, 60.0]
