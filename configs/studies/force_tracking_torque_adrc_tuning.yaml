name: force_tracking_torque_adrc_tuning
profile: ../custom_parallel_gripper.yaml
tasks:
  - ../force_tracking/step.yaml
  - ../force_tracking/ramp.yaml
  - ../force_tracking/mixed_waypoints.yaml
stiffness_estimator_method: secant_ewma
output_root: ../../outputs/studies

# 当前正式 benchmark 使用的参数，始终作为连续任务性能约束的参照。
baseline:
  measurement_filter_cutoff_hz: 40.0
  controller_bandwidth_rad_s: 60.0
  observer_bandwidth_ratio: 4.0

# 粗扫只使用一个材料和固定随机种子，先剔除明显不合适的带宽组合。
coarse:
  materials: [medium]
  seeds: {start: 0, count: 1}
  measurement_filter_cutoffs_hz: [30.0, 40.0, 60.0]
  controller_bandwidths_rad_s: [30.0, 40.0, 50.0, 60.0]
  observer_bandwidth_ratios: [2.0, 3.0, 4.0]

# 确认阶段从粗扫的可行候选中选前五个，并在三种接触 preset、三种 seed 上复验。
confirm:
  materials: [medium, hard, stiff]
  seeds: {start: 0, count: 3}
  measurement_filter_cutoffs_hz: [30.0, 40.0, 60.0]
  controller_bandwidths_rad_s: [30.0, 40.0, 50.0, 60.0]
  observer_bandwidth_ratios: [2.0, 3.0, 4.0]
confirm_top_candidates: 5

constraints:
  max_torque_saturation_ratio: 0.01
  max_ramp_rmse_ratio_to_baseline: 1.10
  max_mixed_rmse_ratio_to_baseline: 1.10
