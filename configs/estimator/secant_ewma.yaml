# @package estimator
# 相邻有效样本的割线刚度，经 EWMA 平滑；对局部变化响应快，但更受单步测量噪声影响。
name: secant_ewma
stiffness:
  # 单位 N/m：接触重置后的初值，以及接受割线样本前后的物理裁剪范围。
  initial_n_per_m: 3000.0
  min_n_per_m: 250.0
  max_n_per_m: 25000.0
  # EWMA 新样本权重；越大响应越快，越小越平滑。
  filter_alpha: 0.15
  # 相邻两帧必须同时满足的最小闭合行程（m）与法向力变化（N），否则拒绝更新。
  min_delta_closure_m: 0.00005
  min_delta_force_n: 0.025
  # 割线法不使用窗口拟合；保留这两个字段以维持统一 schema。
  window_size: 25
  min_samples: 8
