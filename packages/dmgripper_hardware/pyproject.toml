[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmgripper-hardware"
version = "0.1.0"
description = "DM4310P USB2CAN 纯 Python 协议与传输抽象"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["dm-grasp-core==0.1.0", "pyserial>=3.5,<4"]

[project.scripts]
dmgripper-state-probe = "dmgripper_hardware.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["D400", "D401", "D403", "D404", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"
