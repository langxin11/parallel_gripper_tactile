[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-grasp-core"
version = "0.1.0"
description = "DMgripper 共享控制核：导纳、运动学、MIT 协议量化与法向力跟踪"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=2.0",
    "simple-pid>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["D400", "D401", "D403", "D404", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"
