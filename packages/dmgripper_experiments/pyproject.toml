[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmgripper-experiments"
version = "0.2.0"
description = "DM4310P 与 PapillArray 的纯 Python 真机实验入口"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dm-grasp-core==0.1.0",
    "dmgripper-hardware==0.1.0",
    "papillarray-hardware==0.1.0",
    "PyYAML>=6.0",
    "tyro>=0.9.0",
    "matplotlib>=3.8",
    "SciencePlots>=2.1",
    "rich>=13.0",
]

[project.scripts]
dmgripper-run = "dmgripper_experiments.cli:main"
dmgripper-plot = "dmgripper_experiments.plot_cli:main"
dmgripper-force-demo = "dmgripper_experiments.legacy:force_demo_main"
dmgripper-cup = "dmgripper_experiments.legacy:cup_main"
dmgripper-cup-plot = "dmgripper_experiments.legacy:cup_plot_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["D400", "D401", "D403", "D404", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"
