[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotiq-grasp-core"
version = "0.1.0"
description = "无 ROS、MuJoCo 依赖的 Robotiq 离散力控制核"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["D400", "D401", "D403", "D404", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"
